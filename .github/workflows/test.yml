name: "Build Anixpkgs"
on:
  pull_request:
  push:
    branches:
      - master

env:
  NIXOS_VERSION: 26.05

# A newer push to a PR (including the lint/lock bots' auto-commits) supersedes
# its in-flight run; the merge queue only reads CI for the PR's head SHA.
# Pushes to master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Check Lint Nix Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.head_ref || github.ref_name }}
        fetch-depth: 0
        ssh-key: ${{ secrets.ANIXBOT_DEPLOY_KEY }}
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - run: |
        branch=${{ github.head_ref || github.ref_name }}
        git config user.name "goromal (bot)"
        git config user.email "goromal.bot@gmail.com"
        nix-shell -p nixfmt --run "bash scripts/lint.sh"
        num_changes=$(git status --porcelain=v1 2>/dev/null | wc -l)
        if [[ $num_changes -ge 1 ]]; then
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Committing linting changes"
            git add .
            git commit -m "Lint format"
            git push origin $branch
          else
            echo "Lint changes detected, but skipping auto-commit on ${{ github.event_name }}"
          fi
        else
          echo "No linting changes to commit"
        fi
        nix-shell -p nixfmt --run "bash scripts/lint.sh check"
  check-flake-lock:
    name: Check Flake Lock Sync
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.head_ref || github.ref_name }}
        fetch-depth: 0
        ssh-key: ${{ secrets.ANIXBOT_DEPLOY_KEY }}
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - run: |
        branch=${{ github.head_ref || github.ref_name }}
        git config user.name "goromal (bot)"
        git config user.email "goromal.bot@gmail.com"
        python scripts/update_deps.py
        num_changes=$(git status --porcelain=v1 2>/dev/null | wc -l)
        if [[ $num_changes -ge 1 ]]; then
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Committing changes to flake lock"
            git add .
            git commit -m "Update flake lock"
            git push origin $branch
          else
            echo "Flake lock out of date, but skipping auto-commit on ${{ github.event_name }}"
          fi
        else
          echo "No lock changes to commit"
        fi
        nix flake lock --no-update-lock-file
  check-deps:
    name: Check Dependencies
    needs: check-flake-lock
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - run: |
        python -m unittest scripts/test_check_deps.py
        python -m unittest scripts/test_merge_queue.py
        python -m unittest pkgs/modules/notion-mcp/test_notion_mcp_server.py
        num_side_branches=$(python scripts/check_deps.py | wc -l)
        if [[ $num_side_branches -ge 1 ]]; then
          echo "ERROR: Detected $num_side_branches dependencies on a side branch"
          exit 1
        else
          echo "No dependencies detected on a side branch"
        fi
  fetch-cache:
    name: Warm Nix Fetch Cache
    runs-on: ubuntu-latest
    # Every evaluating job's first eval otherwise spends ~1-2 min downloading
    # and unpacking ~60 flake inputs into ~/.cache/nix. This archives all of
    # them once per flake.lock; other jobs restore it (falling back to the
    # previous lock's cache, which covers most inputs).
    steps:
    - uses: actions/checkout@v5
    - id: lookup
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        lookup-only: true
    - if: steps.lookup.outputs.cache-hit != 'true'
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - if: steps.lookup.outputs.cache-hit != 'true'
      run: |
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
        nix flake archive >/dev/null
        nix-instantiate --eval -E '(import <nixpkgs> { }).lib.version' >/dev/null
    - if: steps.lookup.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
  envs:
    name: Build Environments
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - run: ./scripts/build_envs.sh
  cpp:
    name: C++ Packages
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - run: ./scripts/build_pkgs.sh cpp
  rust:
    name: Rust Packages
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - run: ./scripts/build_pkgs.sh rust
  python:
    name: Python Packages
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - run: ./scripts/build_pkgs.sh python
  bash:
    name: Bash Packages
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - run: ./scripts/build_pkgs.sh bash
  java:
    name: Java Packages
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - run: ./scripts/build_pkgs.sh java
  js:
    name: JavaScript Packages
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - run: ./scripts/build_pkgs.sh js
  generate-docs-dry:
    name: Generate Docs (Dry Run)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: |
        NIXPKGS_ALLOW_UNFREE=1 python scripts/generate_docs.py
        num_changes=$(git status --porcelain=v1 2>/dev/null | wc -l)
        if [[ $num_changes -ge 1 ]]; then
          echo "Found changes to $num_changes docs"
        else
          echo "No detected changes to auto-generated docs"
        fi
  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: >
        cd test && nix-shell --run "bash test.sh"
  profile-smoke-test:
    name: Profile Option Smoke Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - run: NIXOS_VERSION=${{ env.NIXOS_VERSION }} python3 scripts/test_profile_contracts.py
    - run: NIXOS_VERSION=${{ env.NIXOS_VERSION }} python3 scripts/smoke_test_profiles.py
  machines-shard:
    name: Machine Checks (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
        extra_nix_config: |
          extra-platforms = aarch64-linux
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - run: >
        MACHINE_CHECK_SHARD=${{ matrix.shard }}/3 bash scripts/check_machines.sh
  machines:
    # Required status check; passes only if every shard passed.
    name: Machine Checks
    needs: machines-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: '[[ "${{ needs.machines-shard.result }}" == "success" ]]'
  changes:
    name: Detect drone path changes
    runs-on: ubuntu-latest
    outputs:
      drone: ${{ steps.filter.outputs.drone }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - id: filter
      # The drone VM jobs (boot smoke + INDI flight) are heavy (~30-60 min)
      # and irrelevant to the ~90% of PRs that don't touch drone code, so gate
      # them on the drone closure: the SITL configs (obc-sitl -> drone-obc-sim
      # -> drone-base and its imported service modules), the drone packages
      # (arducopter, microxrce, indi-harness, orchestrator), the flake pins
      # (ardupilot/indi-harness revs), dependencies.nix, and this workflow.
      # Non-PR events (push to master) always run them.
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "Non-PR event (${{ github.event_name }}) -> running drone VM jobs."
          echo "drone=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        base="${{ github.event.pull_request.base.sha }}"
        pattern='^(flake\.(nix|lock)|pkgs/nixos/(dependencies|drone-base)\.nix|pkgs/nixos/profiles/drone-obc-sim\.nix|pkgs/nixos/configurations/drone-obc-sitl\.nix|pkgs/nixos/sitl-envs/|pkgs/cxx-packages/(arducopter|microxrce-dds-agent|microxrce-dds-gen)/|pkgs/python-packages/(indi-harness|orchestrator)/|\.github/workflows/test\.yml)'
        matched=$(git diff --name-only "$base"...HEAD | grep -E "$pattern" || true)
        if [ -n "$matched" ]; then
          echo "Drone-relevant changes -> running drone VM jobs:"
          echo "$matched" | sed 's/^/  /'
          echo "drone=true" >> "$GITHUB_OUTPUT"
        else
          echo "No drone-relevant changes -> skipping drone VM jobs."
          echo "drone=false" >> "$GITHUB_OUTPUT"
        fi
  drone-sim:
    name: Drone SITL VM Test
    needs: changes
    if: needs.changes.outputs.drone == 'true'
    runs-on: ubuntu-latest
    # Guards against ros.cachix.org eviction silently degrading this job
    # into an hours-long ROS-from-source build.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - name: Enable KVM for the test VM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
        extra_nix_config: |
          extra-substituters = https://ros.cachix.org
          extra-trusted-public-keys = ros.cachix.org-1:dSyZxI8geDCJrwgvCOHDoAfOm5sV1wCPjBkKL+38Rvo=
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # Don't auto-push the whole VM test closure; the mirror step below
        # pushes only the ROS env closure (the only paths at eviction risk).
        skipPush: true
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - name: Build and run drone sim VM test
      run: |
        sed -i 's|local-build = false;|local-build = true;|g' pkgs/nixos/dependencies.nix
        nix-build pkgs/nixos/sitl-envs/dronesim.nix -A driver -o /tmp/dronesim-driver
        /tmp/dronesim-driver/bin/nixos-test-driver
    - name: Mirror ROS env closure to github-public
      run: |
        nix-store -qR /tmp/dronesim-driver | grep -- '-ros-env$' \
          | xargs nix-store -qR | sort -u | cachix push github-public

  drone-indi-flight:
    name: Drone INDI Flight Gate
    needs: changes
    if: needs.changes.outputs.drone == 'true'
    runs-on: ubuntu-latest
    # The single comprehensive drone flight gate. Boots the SITL + ROS2/DDS stack
    # and flies the full trajectory battery with the in-firmware INDI outer loop
    # (CC_TYPE=3, CC3_OUTER_EN=1), driven by the ROS2 trajectory-server publishing
    # ardupilot_msgs/FlatSetpoint over the custom AP_DDS topic. Asserts the
    # flat-tracking win (aggregate RMS < 1.5 m, which forces the figure-eight
    # improvement over the stock/inner-only controllers' ~5.0 m), no altitude
    # runaway, and the DDS-staleness -> stock-fallback path between cases.
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - name: Enable KVM for the test VM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
        extra_nix_config: |
          extra-substituters = https://ros.cachix.org
          extra-trusted-public-keys = ros.cachix.org-1:dSyZxI8geDCJrwgvCOHDoAfOm5sV1wCPjBkKL+38Rvo=
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        skipPush: true
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - name: Build and run the drone flight gate
      run: |
        sed -i 's|local-build = false;|local-build = true;|g' pkgs/nixos/dependencies.nix
        nix-build pkgs/nixos/sitl-envs/indi-flatness-outer-loop.nix -A driver -o /tmp/flight-driver
        /tmp/flight-driver/bin/nixos-test-driver

  drone-indi-actuator-probe:
    name: Drone INDI Actuator Probe
    needs: changes
    if: needs.changes.outputs.drone == 'true'
    runs-on: ubuntu-latest
    # Split from the flight gate so the two run concurrently.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - name: Enable KVM for the test VM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
        extra_nix_config: |
          extra-substituters = https://ros.cachix.org
          extra-trusted-public-keys = ros.cachix.org-1:dSyZxI8geDCJrwgvCOHDoAfOm5sV1wCPjBkKL+38Rvo=
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        skipPush: true
    - run: >
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - name: Check measured-actuator math, flight, RPM dropout and recovery
      run: |
        sed -i 's|local-build = false;|local-build = true;|g' pkgs/nixos/dependencies.nix
        nix-build pkgs/nixos/sitl-envs/indi-actuator-probe.nix -A flight -o /tmp/actuator-probe

  drone-indi-drag-frame:
    name: Drone INDI Drag-Rejection Frame Gate
    needs: changes
    if: needs.changes.outputs.drone == 'true'
    runs-on: ubuntu-latest
    # Validates the custom pysignals-based ArduPilot-SITL JSON physics
    # platform: boots the aero-fidelity jsonsim backend and flies STOCK
    # ArduCopter (CC_TYPE=0, unmodified PID) through the drag-rejection
    # battery, asserting correct frame/sign conventions (NED, motor mixing,
    # attitude) so the platform is trustworthy for controller A/B work. The
    # INDI-buzz envs (indi-drag-rejection-indi*.nix) are NOT gated here: they
    # fail by design to encode the actuator-lag INDI finding and ship as
    # documented diagnostics only (see
    # indi-harness/docs/json_physics_backend_results.md).
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    # Flake inputs unpacked by earlier runs; see the fetch-cache job.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ hashFiles('flake.lock') }}
        restore-keys: nix-fetch-
    - name: Enable KVM for the test VM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
        extra_nix_config: |
          extra-substituters = https://ros.cachix.org
