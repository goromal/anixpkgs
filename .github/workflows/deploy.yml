name: Deploy
on:
  pull_request:
    types:
      - closed
  workflow_call:
    inputs:
      release:
        description: "Version bump type: major, minor, patch, or none"
        required: true
        type: string

jobs:
  resolve:
    name: Resolve Release
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
    - id: resolve
      env:
        INPUT_RELEASE: ${{ inputs.release }}
        MERGED: ${{ github.event.pull_request.merged }}
        MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'MajorRelease') }}
        MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'MinorRelease') }}
        PATCH: ${{ contains(github.event.pull_request.labels.*.name, 'PatchRelease') }}
      run: |
        if [[ -n "$INPUT_RELEASE" ]]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "release=$INPUT_RELEASE" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$MERGED" == "true" ]]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi
        if [[ "$MAJOR" == "true" ]]; then
          echo "release=major" >> "$GITHUB_OUTPUT"
        elif [[ "$MINOR" == "true" ]]; then
          echo "release=minor" >> "$GITHUB_OUTPUT"
        elif [[ "$PATCH" == "true" ]]; then
          echo "release=patch" >> "$GITHUB_OUTPUT"
        else
          echo "release=none" >> "$GITHUB_OUTPUT"
        fi
  bump-version:
    name: Version Bump
    needs: resolve
    if: ${{ needs.resolve.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        ssh-key: ${{ secrets.ANIXBOT_DEPLOY_KEY }}
    - env:
        RELEASE: ${{ needs.resolve.outputs.release }}
      run: |
        git config user.name "goromal (bot)"
        git config user.email "goromal.bot@gmail.com"
        git checkout master
        if [[ "$RELEASE" != "none" ]]; then
            python scripts/increment_anix.py "$RELEASE"
            git pull origin master
            git add .
            git commit -m "Bump $RELEASE ANIX_VERSION -> $(cat ANIX_VERSION)"
            git push origin master
        fi
  generate-docs:
    name: Generate Docs
    needs: [resolve, bump-version]
    if: ${{ needs.resolve.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        ssh-key: ${{ secrets.ANIXBOT_DEPLOY_KEY }}
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: |
        git config user.name "goromal (bot)"
        git config user.email "goromal.bot@gmail.com"
        git checkout master
        git pull origin master
        NIXPKGS_ALLOW_UNFREE=1 python scripts/generate_docs.py
        num_changes=$(git status --porcelain=v1 2>/dev/null | wc -l)
        if [[ $num_changes -ge 1 ]]; then
          echo "Committing changes to $num_changes docs"
          git add .
          git commit -m "Generate updated docs"
          git push origin master
        else
          echo "No docs changes to commit"
        fi
  publish-docs:
    name: Publish Docs
    needs: [resolve, generate-docs]
    if: ${{ needs.resolve.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To push a branch 
      pull-requests: write  # To create a PR from that branch
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        fetch-depth: 0
    - name: Install latest mdbook
      run: |
        tag=$(curl 'https://api.github.com/repos/rust-lang/mdbook/releases/latest' | jq -r '.tag_name')
        url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
        mkdir mdbook
        curl -sSL $url | tar -xz --directory=./mdbook
        echo `pwd`/mdbook >> $GITHUB_PATH
    - name: Deploy GitHub Pages
      run: |
        git config user.name "goromal (bot)"
        git config user.email "goromal.bot@gmail.com"
        git checkout master
        git pull origin master
        cd docs
        mdbook build
        git worktree add gh-pages
        cd gh-pages
        # Delete the ref to avoid keeping history.
        git update-ref -d refs/heads/gh-pages
        rm -rf *
        mv ../book/* .
        git add .
        git commit -m "Deploy $GITHUB_SHA to gh-pages"
        git push --force --set-upstream origin gh-pages
  tag-release:
    name: Tag Release
    needs: [resolve, generate-docs]
    if: ${{ needs.resolve.outputs.run == 'true' && needs.resolve.outputs.release != 'none' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        ssh-key: ${{ secrets.ANIXBOT_DEPLOY_KEY }}
    - run: |
        git config user.name "goromal (bot)"
        git config user.email "goromal.bot@gmail.com"
        git checkout master
        git pull origin master
        git tag v$(cat ANIX_VERSION) HEAD
        git push --tags
