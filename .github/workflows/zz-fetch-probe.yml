name: "TEMP Fetch Probe"
on:
  pull_request:

env:
  NIXOS_VERSION: 26.05
  NIXPKGS_ALLOW_UNFREE: 1
  NIXPKGS_ALLOW_INSECURE: 1
  NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - name: warm
      run: |
        s=$SECONDS; nix flake archive >/dev/null 2>&1; echo "TIMING archive $((SECONDS-s))s"
        s=$SECONDS; nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version' >/dev/null 2>&1; echo "TIMING channel $((SECONDS-s))s"
        du -sh ~/.cache/nix
    - uses: actions/cache/save@v4
      with:
        path: ~/.cache/nix
        key: fetch-probe3-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
  measure:
    needs: warm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cache: [none, warm]
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-${{ env.NIXOS_VERSION }}
    - uses: cachix/cachix-action@v14
      with:
        name: github-public
        skipPush: true
    - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
    - if: matrix.cache == 'warm'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/nix
        key: fetch-probe3-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
    - name: probe
      run: |
        sed -i 's|local-build = false;|local-build = true;|g' pkgs/nixos/dependencies.nix
        s=$SECONDS; python3 scripts/ci_build.py python >/dev/null 2>&1; echo "TIMING ${{ matrix.cache }} ci_build-python $((SECONDS-s))s"
        s=$SECONDS; nix eval --raw .#nixosConfigurations.ats.config.system.build.toplevel.drvPath --impure >/dev/null 2>&1; echo "TIMING ${{ matrix.cache }} ats-eval $((SECONDS-s))s"
        s=$SECONDS; nix eval --raw .#nixosConfigurations.ats.config.system.build.toplevel.drvPath --impure >/dev/null 2>&1; echo "TIMING ${{ matrix.cache }} ats-eval-warm $((SECONDS-s))s"
