name: "Merge Queue"

on:
  # pull_request_target (not pull_request) so label-triggered runs use master's
  # workflow definitions; no job checks out or executes PR code.
  pull_request_target:
    types:
      - labeled
  workflow_run:
    workflows:
      - "Build Anixpkgs"
      - "Deploy"
      - "Manual Release Tag"
    types:
      - completed
  issues:
    types:
      - closed
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: merge-queue
  cancel-in-progress: false

jobs:
  advance:
    name: Advance Queue
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    outputs:
      merged_pr: ${{ steps.queue.outputs.merged_pr }}
      release: ${{ steps.queue.outputs.release }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        fetch-depth: 0
        ssh-key: ${{ secrets.ANIXBOT_DEPLOY_KEY }}
    - id: queue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "goromal (bot)"
        git config user.email "goromal.bot@gmail.com"
        python3 scripts/merge_queue.py
  deploy:
    name: Deploy Merged PR
    needs: advance
    if: ${{ needs.advance.outputs.merged_pr != '' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    with:
      release: ${{ needs.advance.outputs.release }}
    secrets: inherit
  continue:
    name: Process Next PR
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run merge-queue.yml --repo "${{ github.repository }}" --ref master
  pause:
    name: Pause Queue On Deploy Failure
    needs:
    - advance
    - deploy
    if: ${{ failure() && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PR: ${{ needs.advance.outputs.merged_pr }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        gh label create merge-queue-paused --repo "$REPO" --color B60205 --force \
          --description "Open issues with this label pause the merge queue"
        gh issue create --repo "$REPO" --label merge-queue-paused \
          --title "Merge queue paused: deploy of #$PR failed" \
          --body "Post-merge deploy of #$PR failed: $RUN_URL. Fix master (version bump, docs, tag), then close this issue to resume the queue."
