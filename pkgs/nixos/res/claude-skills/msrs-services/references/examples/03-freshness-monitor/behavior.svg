<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">3. A telemetry freshness monitor</title>
<desc id="desc">Editable source is the adjacent behavior.drawio. Transition and rule IDs refer to SPEC.md.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="900" height="390" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="450.0" y="35.7" text-anchor="middle" font-size="22" font-weight="bold">3. A telemetry freshness monitor</text>
<ellipse cx="85.0" cy="160.0" rx="10.0" ry="10.0" fill="#334155"/>
<rect x="150" y="125" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="1.5"/>
<text x="235.0" y="166.0" font-size="16" text-anchor="middle">S1 / stale</text>
<rect x="560" y="125" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="1.5"/>
<text x="645.0" y="166.0" font-size="16" text-anchor="middle">S2 / fresh</text>
<path d="M95,160 L150,160" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M235,125 L235,90 L645,90 L645,125" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450.0" y="71.9" text-anchor="middle" font-size="14">T1: computed age &lt; 100 ms</text>
<path d="M645,195 L645,235 L235,235 L235,195" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450.0" y="256.9" text-anchor="middle" font-size="14">T2: computed age ≥ 100 ms</text>
<text x="450.0" y="301.9" text-anchor="middle" font-size="14">Accept this cycle’s valid sample before computing age. Emit one Status per cycle.</text>
<text x="450.0" y="329.9" text-anchor="middle" font-size="14">T3: backward time → clear baseline, stale / clock_reset (from either state).</text>
<text x="450.0" y="357.9" text-anchor="middle" font-size="14">T4: unchanged classification → update age/status internally. Startup: stale / no sample.</text>
</g></svg>
