<text x="430.0" y="291.9" text-anchor="middle" font-size="14">T3: repeated value → reply with current value; no state re-entry.</text>
<text x="430.0" y="319.9" text-anchor="middle" font-size="14">Every command produces one Status. Startup is off with no output.</text>
