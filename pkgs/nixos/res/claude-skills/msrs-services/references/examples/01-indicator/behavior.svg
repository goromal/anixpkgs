<path d="M235,120 L235,90 L595,90 L595,120" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="415.0" y="71.9" text-anchor="middle" font-size="14">T1: Set(true)</text>
