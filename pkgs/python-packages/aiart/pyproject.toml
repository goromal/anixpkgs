[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aiart"
version = "0.1.0"
description = "Agent-driven local 2D and 3D art workflows"
requires-python = ">=3.11"
dependencies = ["requests", "textual"]

[project.scripts]
aiart = "aiart.cli:main"

[tool.setuptools]
packages = ["aiart"]

[tool.setuptools.package-data]
aiart = ["workflows/*.json", "blender_scripts/*.py"]
